<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon compte | SUM'IT</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* === Mon Compte === */
    .compte-section {
      padding: 60px 80px 100px;
      max-width: 1280px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .compte-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 32px;
      align-items: start;
    }

    /* Sidebar profil */
    .compte-sidebar {
      position: sticky;
      top: 90px;
    }
    .compte-card {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 16px;
    }
    .compte-avatar-big {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--gradient-summit);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display);
      font-size: 32px; font-weight: 700;
      color: var(--bg);
      margin: 0 auto 16px;
      overflow: hidden;
    }
    .compte-avatar-big img { width: 100%; height: 100%; object-fit: cover; }

    .compte-name {
      font-family: var(--font-display);
      font-size: 22px; font-weight: 600;
      color: var(--text);
      text-align: center;
      margin-bottom: 4px;
    }
    .compte-email {
      font-size: 12px;
      color: var(--text-3);
      text-align: center;
      margin-bottom: 18px;
    }

    .compte-stat {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-top: 1px solid var(--line);
      font-size: 12px;
    }
    .compte-stat-label { color: var(--text-3); }
    .compte-stat-val {
      color: var(--text);
      font-family: var(--font-display);
      font-weight: 600;
    }

    .btn-logout {
      width: 100%;
      background: transparent;
      color: var(--text-2);
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    /* Onglets Trail/Rando */
    .profil-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }
    .profil-tab {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-3);
      padding: 12px 24px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .profil-tab:hover { color: var(--text-2); }
    .profil-tab.active {
      color: var(--sun);
      border-bottom-color: var(--sun);
    }

    /* Section principale */
    .compte-main h2 {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }
    .compte-main .section-desc {
      color: var(--text-2);
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* Cards info profil */
    .profil-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }
    .profil-summary-card {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 18px;
    }
    .ps-label {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 6px;
    }
    .ps-val {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }
    .ps-val.gradient {
      background: var(--gradient-summit);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .ps-sub {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
    }

    /* Section import */
    .import-section {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 32px;
    }
    .import-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .import-card {
      background: var(--bg);
      border: 1.5px dashed var(--line-2);
      border-radius: 6px;
      padding: 28px;
      text-align: center;
      transition: all 0.2s;
      cursor: pointer;
    }
    .import-card:hover {
      border-color: var(--sun);
      background: rgba(255, 200, 87, 0.03);
    }
    .import-card .icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255, 200, 87, 0.12);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
    }
    .import-card .icon svg {
      width: 22px; height: 22px;
      stroke: var(--sun); fill: none; stroke-width: 1.8;
    }
    .import-card.strava .icon {
      background: rgba(252, 76, 2, 0.12);
    }
    .import-card.strava .icon svg { stroke: #FC4C02; }
    .import-card h4 {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: 0.02em;
    }
    .import-card p {
      font-size: 12px;
      color: var(--text-3);
    }
    .strava-status {
      font-size: 11px;
      color: var(--leaf);
      margin-top: 6px;
      display: none;
    }
    .strava-status.connected { display: block; }

    /* Liste activités */
    .activites-list {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .activites-header {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }
    .activites-header h3 {
      font-family: var(--font-display);
      font-size: 16px;
      color: var(--text);
      letter-spacing: 0.04em;
    }
    .activite-row {
      display: grid;
      grid-template-columns: 30px 1fr auto auto auto auto;
      gap: 16px;
      align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid var(--line);
      transition: background 0.2s;
    }
    .activite-row:last-child { border-bottom: none; }
    .activite-row:hover { background: var(--bg-3); }
    .source-badge {
      width: 28px; height: 28px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-family: var(--font-display);
      font-weight: 700;
    }
    .source-badge.manual { background: rgba(255, 200, 87, 0.15); color: var(--sun); }
    .source-badge.strava { background: rgba(252, 76, 2, 0.15); color: #FC4C02; }
    .activite-name {
      font-size: 13px;
      color: var(--text);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .activite-meta {
      font-family: var(--font-display);
      font-size: 12px;
      color: var(--text-2);
      min-width: 60px;
      text-align: right;
    }
    .activite-type-tag {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 3px;
      border: 1px solid var(--line-2);
    }
    .activite-type-tag.course { color: var(--sun); border-color: rgba(255, 200, 87, 0.4); background: rgba(255, 200, 87, 0.08); }
    .activite-type-tag.entrainement { color: var(--leaf); border-color: rgba(107, 179, 107, 0.4); background: rgba(107, 179, 107, 0.08); }
    .activite-type-tag.sortie { color: var(--sky); border-color: rgba(79, 163, 217, 0.4); background: rgba(79, 163, 217, 0.08); }
    .btn-delete {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text-3);
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-delete:hover { border-color: var(--danger); color: var(--danger); }
    .btn-delete svg { width: 14px; height: 14px; display: block; fill: none; stroke: currentColor; stroke-width: 2; }

    .activites-empty {
      padding: 40px 24px;
      text-align: center;
      color: var(--text-3);
      font-size: 13px;
    }

    /* Simulations épinglées */
    .sims-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .sim-card {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      transition: all 0.2s;
      position: relative;
    }
    .sim-card:hover { border-color: var(--sun); }
    .sim-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .sim-card-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .sim-card-date {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
    }
    .sim-card-time {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      background: var(--gradient-summit);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 8px 0;
    }
    .sim-card-meta {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: var(--text-2);
      font-family: var(--font-display);
      letter-spacing: 0.04em;
    }

    /* Modale Strava */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: var(--bg);
      border: 1px solid var(--line-2);
      border-radius: 8px;
      max-width: 700px;
      width: 100%;
      max-height: 80vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 {
      font-family: var(--font-display);
      font-size: 20px;
      color: var(--text);
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-2);
      cursor: pointer;
      font-size: 24px;
      line-height: 1;
    }
    .modal-body {
      padding: 20px 24px;
      overflow-y: auto;
      flex: 1;
    }
    .strava-activity {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 16px;
      align-items: center;
      padding: 14px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    .strava-activity:hover { border-color: var(--sun); }
    .sa-name {
      font-size: 13px;
      color: var(--text);
      font-weight: 500;
    }
    .sa-meta {
      font-family: var(--font-display);
      font-size: 12px;
      color: var(--text-3);
      margin-top: 2px;
    }
    .sa-stats {
      font-family: var(--font-display);
      font-size: 12px;
      color: var(--text-2);
      text-align: right;
    }
    .btn-import-sa {
      background: var(--gradient-summit);
      color: var(--bg);
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 8px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-import-sa:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Login required */
    .login-required {
      text-align: center;
      padding: 100px 40px;
    }
    .login-required h2 {
      font-family: var(--font-display);
      font-size: 36px;
      color: var(--text);
      margin-bottom: 12px;
    }
    .login-required p {
      color: var(--text-2);
      margin-bottom: 32px;
    }

    @media (max-width: 900px) {
      .compte-grid { grid-template-columns: 1fr; }
      .compte-sidebar { position: relative; top: 0; }
      .profil-summary { grid-template-columns: 1fr 1fr; }
      .import-grid { grid-template-columns: 1fr; }
      .compte-section { padding: 40px 24px; }
      .activite-row { grid-template-columns: 30px 1fr auto; gap: 10px; }
      .activite-meta:nth-child(4), .activite-meta:nth-child(5), .activite-type-tag { display: none; }
    }
  </style>
</head>
<body>

  <!-- ══════════════════════════════════════════════════════════════
       NAVIGATION
       ══════════════════════════════════════════════════════════════ -->
  <nav class="nav">
    <a href="/" class="nav-logo">
      <div class="nav-logo-icon">S</div>
      <div class="nav-logo-text">
        <div class="nav-logo-name">SUM<span>'IT</span></div>
        <div class="nav-logo-sub">Plan your peaks</div>
      </div>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link">Accueil</a>
      <a href="profil.html" class="nav-link">Mon profil</a>
      <a href="simulateur.html" class="nav-link">Simulateur</a>
      <a href="avenir.html" class="nav-link">À venir</a>
      <a href="compte.html" class="nav-link active">Mon compte</a>
    </div>
  </nav>

  <!-- ══════════════════════════════════════════════════════════════
       PAGE HERO
       ══════════════════════════════════════════════════════════════ -->
  <section class="page-hero">
    <div class="page-hero-content">
      <div class="section-tag">Mon espace</div>
      <h1>Mon <em>compte</em></h1>
      <p>Gère ton profil coureur, tes activités et tes simulations enregistrées.</p>
    </div>
  </section>

  <!-- ══════════════════════════════════════════════════════════════
       CONTENU PRINCIPAL
       ══════════════════════════════════════════════════════════════ -->
  <section class="compte-section" id="compteSection">
    <!-- Sera rempli dynamiquement -->
  </section>

  <!-- ══════════════════════════════════════════════════════════════
       MODALE IMPORT STRAVA
       ══════════════════════════════════════════════════════════════ -->
  <div class="modal-overlay" id="modalStrava">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📥 Importer depuis Strava</h3>
        <button class="modal-close" onclick="fermerModalStrava()">×</button>
      </div>
      <div class="modal-body" id="stravaActivitiesList">
        <p style="text-align:center;color:var(--text-3)">Chargement des activités...</p>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════
       FOOTER
       ══════════════════════════════════════════════════════════════ -->
  <footer class="footer">
    <div>
      <div class="footer-logo">SUM<span>'IT</span></div>
      <div class="footer-sub">PLAN YOUR PEAKS</div>
    </div>
    <div class="footer-copy">© 2025 SUM'IT — Beta</div>
  </footer>

  <!-- ══════════════════════════════════════════════════════════════
       SCRIPTS
       ══════════════════════════════════════════════════════════════ -->
  <script src="../js/api-client.js"></script>
  <script src="../js/nav-user.js"></script>
  <script>

    let currentProfilType = 'trail';
    let currentUser = null;
    let currentActivites = [];
    let currentSimulations = [];

    // ── Init ────────────────────────────────────────────────────
    (async function init() {
      const section = document.getElementById('compteSection');

      if (!isLoggedIn()) {
        section.innerHTML = `
          <div class="login-required">
            <h2>Connecte-toi pour accéder à ton compte</h2>
            <p>Sauvegarde ton profil coureur et tes simulations en un clic.</p>
            <button class="btn-primary" onclick="loginGoogle()" style="font-size:14px;">
              Se connecter avec Google
            </button>
          </div>
        `;
        return;
      }

      // Vérifier le retour Strava
      const params = new URLSearchParams(window.location.search);
      if (params.get('strava_connected') === '1') {
        setTimeout(() => alert('✅ Compte Strava connecté avec succès !'), 200);
        const url = new URL(window.location);
        url.searchParams.delete('strava_connected');
        window.history.replaceState({}, '', url.toString());
      }
      const stravaError = params.get('strava_error');
      if (stravaError) {
        setTimeout(() => alert(`❌ Erreur Strava : ${stravaError}`), 200);
        const url = new URL(window.location);
        url.searchParams.delete('strava_error');
        window.history.replaceState({}, '', url.toString());
      }

      try {
        currentUser = await fetchMe();
        renderUI();
        await refreshActivites();
        await refreshSimulations();
      } catch (e) {
        section.innerHTML = `<p style="text-align:center;color:var(--danger)">Erreur : ${e.message}</p>`;
      }
    })();

    // ── Render UI ──────────────────────────────────────────────
    function renderUI() {
      const section = document.getElementById('compteSection');
      const prenom = currentUser.prenom || 'Coureur';
      const initiale = prenom[0]?.toUpperCase() || 'C';
      const profilTrail = currentUser.profiles.find(p => p.type === 'trail');
      const profilRando = currentUser.profiles.find(p => p.type === 'rando');
      const profilActuel = currentProfilType === 'trail' ? profilTrail : profilRando;

      section.innerHTML = `
        <div class="compte-grid">
          <!-- SIDEBAR -->
          <aside class="compte-sidebar">
            <div class="compte-card">
              <div class="compte-avatar-big">
                ${currentUser.picture ? `<img src="${currentUser.picture}">` : initiale}
              </div>
              <div class="compte-name">${prenom}</div>
              <div class="compte-email">${currentUser.email}</div>

              <div class="compte-stat">
                <span class="compte-stat-label">FC max</span>
                <span class="compte-stat-val">${currentUser.fcmax} bpm</span>
              </div>
              <div class="compte-stat">
                <span class="compte-stat-label">Profils</span>
                <span class="compte-stat-val">${currentUser.profiles.length} / 2</span>
              </div>
              <div class="compte-stat">
                <span class="compte-stat-label">Strava</span>
                <span class="compte-stat-val" style="color:${currentUser.strava_connected ? 'var(--leaf)' : 'var(--text-3)'}">
                  ${currentUser.strava_connected ? '✓ Connecté' : 'Non lié'}
                </span>
              </div>

              <button class="btn-logout" onclick="logout()">Se déconnecter</button>
            </div>
          </aside>

          <!-- MAIN -->
          <div class="compte-main">
            <!-- Tabs Trail/Rando -->
            <div class="profil-tabs">
              <div class="profil-tab ${currentProfilType==='trail'?'active':''}" onclick="switchTab('trail')">🏃 Trail / Course</div>
              <div class="profil-tab ${currentProfilType==='rando'?'active':''}" onclick="switchTab('rando')">🥾 Randonnée</div>
            </div>

            <!-- Résumé profil -->
            ${profilActuel ? `
              <div class="profil-summary">
                <div class="profil-summary-card">
                  <div class="ps-label">VEP Globale</div>
                  <div class="ps-val gradient">${profilActuel.vep_globale.toFixed(1)}</div>
                  <div class="ps-sub">km/h éq. plat</div>
                </div>
                <div class="profil-summary-card">
                  <div class="ps-label">Activités</div>
                  <div class="ps-val">${profilActuel.nb_traces}</div>
                  <div class="ps-sub">traces analysées</div>
                </div>
                <div class="profil-summary-card">
                  <div class="ps-label">Drain énergie</div>
                  <div class="ps-val">${(profilActuel.drain_moy_h*100).toFixed(1)}</div>
                  <div class="ps-sub">% / heure</div>
                </div>
                <div class="profil-summary-card">
                  <div class="ps-label">Coef course</div>
                  <div class="ps-val">×${profilActuel.coefficient_course.toFixed(2)}</div>
                  <div class="ps-sub">vs entraînement</div>
                </div>
              </div>
            ` : `
              <div class="profil-summary-card" style="text-align:center;padding:32px;margin-bottom:32px;">
                <p style="color:var(--text-2)">Aucun profil ${currentProfilType==='trail'?'trail':'randonnée'} pour l'instant.</p>
                <p style="font-size:12px;color:var(--text-3);margin-top:8px;">Importe au moins une activité pour créer ton profil.</p>
              </div>
            `}

            <!-- IMPORT -->
            <div class="import-section">
              <h3 style="font-family:var(--font-display);font-size:16px;color:var(--text);margin-bottom:14px;letter-spacing:0.04em;">
                ➕ Ajouter une activité ${currentProfilType==='trail' ? 'trail' : 'randonnée'}
              </h3>
              <div class="import-grid">
                <div class="import-card" onclick="document.getElementById('gpxFileInput').click()">
                  <div class="icon">
                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                  </div>
                  <h4>Import GPX</h4>
                  <p>Glisse ou clique pour uploader un fichier GPX</p>
                  <input type="file" id="gpxFileInput" accept=".gpx" style="display:none" onchange="handleGPXUpload(event)">
                </div>
                <div class="import-card strava" onclick="handleStravaClick()">
                  <div class="icon">
                    <svg viewBox="0 0 24 24"><path d="M12 1l9 16-9 6-9-6 9-16z"/></svg>
                  </div>
                  <h4>Import Strava</h4>
                  <p>${currentUser.strava_connected ? 'Choisir parmi tes activités Strava' : 'Connecter ton compte Strava'}</p>
                  <p class="strava-status ${currentUser.strava_connected?'connected':''}">✓ Strava connecté</p>
                </div>
              </div>
            </div>

            <!-- LISTE ACTIVITÉS -->
            <div class="activites-list" style="margin-bottom:32px;">
              <div class="activites-header">
                <h3>📂 Mes activités ${currentProfilType==='trail' ? 'trail' : 'randonnée'}</h3>
                <span style="color:var(--text-3);font-size:12px;font-family:var(--font-display);" id="activitesCount">— activités</span>
              </div>
              <div id="activitesContainer">
                <div class="activites-empty">Chargement...</div>
              </div>
            </div>

            <!-- SIMULATIONS ÉPINGLÉES -->
            <div>
              <h3 style="font-family:var(--font-display);font-size:16px;color:var(--text);margin-bottom:14px;letter-spacing:0.04em;">
                ⭐ Mes simulations épinglées
              </h3>
              <div id="simsContainer" class="sims-grid">
                <div style="grid-column:1/-1;text-align:center;padding:24px;color:var(--text-3);font-size:13px;">Chargement...</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ── Tab switch ──────────────────────────────────────────────
    async function switchTab(type) {
      currentProfilType = type;
      renderUI();
      await refreshActivites();
    }

    // ── Activités ───────────────────────────────────────────────
    async function refreshActivites() {
      try {
        const res = await listerActivites(currentProfilType);
        currentActivites = res.activities || [];
        renderActivites();
      } catch (e) {
        document.getElementById('activitesContainer').innerHTML =
          `<div class="activites-empty">Erreur : ${e.message}</div>`;
      }
    }

    function renderActivites() {
      const cont = document.getElementById('activitesContainer');
      const count = document.getElementById('activitesCount');
      count.textContent = `${currentActivites.length} activité${currentActivites.length>1?'s':''}`;

      if (currentActivites.length === 0) {
        cont.innerHTML = `<div class="activites-empty">Aucune activité pour ce profil. Importe un GPX pour commencer.</div>`;
        return;
      }

      cont.innerHTML = currentActivites.map(a => {
        const dureeMin = Math.round(a.duree_s / 60);
        const dureeFmt = dureeMin >= 60 ? `${Math.floor(dureeMin/60)}h${String(dureeMin%60).padStart(2,'0')}` : `${dureeMin}min`;
        const date = a.date ? new Date(a.date).toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'2-digit'}) : '—';
        return `
          <div class="activite-row">
            <div class="source-badge ${a.source}" title="${a.source === 'strava' ? 'Importé depuis Strava' : 'Import manuel'}">
              ${a.source === 'strava' ? 'S' : '📁'}
            </div>
            <div>
              <div class="activite-name">${a.name || 'Sans nom'}</div>
              <div style="font-size:11px;color:var(--text-3)">${date}</div>
            </div>
            <span class="activite-type-tag ${a.type_sortie}">${a.type_sortie}</span>
            <div class="activite-meta">${a.dist_km.toFixed(1)} km</div>
            <div class="activite-meta">${dureeFmt}</div>
            <button class="btn-delete" onclick="deleteActivite(${a.id})" title="Supprimer">
              <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        `;
      }).join('');
    }

    async function deleteActivite(id) {
      if (!confirm('Supprimer cette activité ? Ton profil sera recalculé automatiquement.')) return;
      try {
        await supprimerActivite(id);
        await refreshActivites();
        // Rafraîchir le profil affiché
        currentUser = await fetchMe();
        renderUI();
        await refreshActivites();
        await refreshSimulations();
      } catch (e) {
        alert('Erreur : ' + e.message);
      }
    }

    // ── Upload GPX ──────────────────────────────────────────────
    async function handleGPXUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const typeSortie = prompt('Type de sortie ? (course / entrainement / sortie)', 'entrainement');
      if (!typeSortie || !['course','entrainement','sortie'].includes(typeSortie)) {
        alert('Type invalide. Utilise: course, entrainement, ou sortie');
        return;
      }

      try {
        await ajouterActiviteGPX(file, typeSortie, currentProfilType);
        // Reset l'input pour permettre re-import du même fichier
        event.target.value = '';
        await refreshActivites();
        currentUser = await fetchMe();
        renderUI();
        await refreshActivites();
        await refreshSimulations();
      } catch (e) {
        alert('Erreur import : ' + e.message);
      }
    }

    // ── Strava ──────────────────────────────────────────────────
    async function handleStravaClick() {
      if (!currentUser.strava_connected) {
        if (confirm('Tu vas être redirigé vers Strava pour autoriser SUM\\'IT à lire tes activités. Continuer ?')) {
          loginStrava();
        }
        return;
      }
      await ouvrirModalStrava();
    }

    async function ouvrirModalStrava() {
      document.getElementById('modalStrava').classList.add('active');
      const list = document.getElementById('stravaActivitiesList');
      list.innerHTML = `<p style="text-align:center;color:var(--text-3)">Chargement des activités Strava...</p>`;

      try {
        const res = await listerActivitesStrava(50);
        const activities = res.activities || [];

        if (activities.length === 0) {
          list.innerHTML = `<p style="text-align:center;color:var(--text-3)">Aucune activité de course/rando trouvée sur Strava.</p>`;
          return;
        }

        // Filtrer celles déjà importées
        const dejaImportes = new Set(currentActivites.filter(a => a.source === 'strava').map(a => a.external_id));

        list.innerHTML = activities.map(a => {
          const date = new Date(a.date).toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'2-digit'});
          const dureeMin = Math.round(a.duree_s / 60);
          const dureeFmt = dureeMin >= 60 ? `${Math.floor(dureeMin/60)}h${String(dureeMin%60).padStart(2,'0')}` : `${dureeMin}min`;
          const isImported = dejaImportes.has(String(a.id));
          return `
            <div class="strava-activity">
              <div>
                <div class="sa-name">${a.name}</div>
                <div class="sa-meta">${a.type} · ${date}</div>
              </div>
              <div class="sa-stats">
                ${a.distance_km.toFixed(1)} km · ${Math.round(a.dplus_m)}m D+<br>
                <span style="color:var(--text-3)">${dureeFmt}</span>
              </div>
              <button class="btn-import-sa" onclick="importerStravaActivity('${a.id}', this)" ${isImported ? 'disabled' : ''}>
                ${isImported ? '✓ Importée' : 'Importer'}
              </button>
            </div>
          `;
        }).join('');
      } catch (e) {
        list.innerHTML = `<p style="color:var(--danger);text-align:center;">Erreur : ${e.message}</p>`;
      }
    }

    function fermerModalStrava() {
      document.getElementById('modalStrava').classList.remove('active');
    }

    async function importerStravaActivity(stravaId, btn) {
      const typeSortie = prompt('Type de sortie ? (course / entrainement / sortie)', 'entrainement');
      if (!typeSortie || !['course','entrainement','sortie'].includes(typeSortie)) return;

      btn.disabled = true;
      btn.textContent = '⏳';
      try {
        await ajouterActiviteStrava(stravaId, typeSortie, currentProfilType);
        btn.textContent = '✓ Importée';
        await refreshActivites();
        currentUser = await fetchMe();
        renderUI();
        await refreshActivites();
        await refreshSimulations();
      } catch (e) {
        alert('Erreur : ' + e.message);
        btn.disabled = false;
        btn.textContent = 'Importer';
      }
    }

    // ── Simulations ─────────────────────────────────────────────
    async function refreshSimulations() {
      try {
        const res = await listerSimulations();
        currentSimulations = res.simulations || [];
        renderSimulations();
      } catch (e) {
        document.getElementById('simsContainer').innerHTML =
          `<div style="grid-column:1/-1;color:var(--text-3);text-align:center;padding:20px;">Erreur : ${e.message}</div>`;
      }
    }

    function renderSimulations() {
      const cont = document.getElementById('simsContainer');
      if (currentSimulations.length === 0) {
        cont.innerHTML = `<div style="grid-column:1/-1;color:var(--text-3);text-align:center;padding:24px;font-size:13px;">
          Aucune simulation épinglée. Va dans le simulateur et clique sur ⭐ pour en sauvegarder une.
        </div>`;
        return;
      }

      cont.innerHTML = currentSimulations.map(s => {
        const date = new Date(s.created_at).toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'2-digit'});
        const h = Math.floor(s.duree_s / 3600);
        const m = Math.floor((s.duree_s % 3600) / 60);
        const dureeFmt = `${h}h${String(m).padStart(2,'0')}`;
        return `
          <div class="sim-card">
            <button class="btn-delete" style="position:absolute;top:14px;right:14px;" onclick="deleteSimulation(${s.id})" title="Supprimer">
              <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
            <div class="sim-card-header">
              <div>
                <div class="sim-card-title">${s.name}</div>
                <div class="sim-card-date">${date}</div>
              </div>
            </div>
            <div class="sim-card-time">${dureeFmt}</div>
            <div class="sim-card-meta">
              <span>${s.dist_km.toFixed(1)} km</span>
              <span>·</span>
              <span>${Math.round(s.dplus_m)} m D+</span>
            </div>
          </div>
        `;
      }).join('');
    }

    async function deleteSimulation(id) {
      if (!confirm('Supprimer cette simulation ?')) return;
      try {
        await supprimerSimulation(id);
        await refreshSimulations();
      } catch (e) {
        alert('Erreur : ' + e.message);
      }
    }

  </script>
</body>
</html>
