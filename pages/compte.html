<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon compte | SUM'IT</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* === Layout === */
    .compte-section {
      padding: 50px 80px 100px;
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* === Header utilisateur === */
    .compte-header {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 28px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 28px;
    }
    .compte-header-avatar {
      width: 84px; height: 84px;
      border-radius: 50%;
      background: var(--gradient-summit);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display);
      font-size: 32px; font-weight: 700;
      color: var(--bg);
      flex-shrink: 0;
      overflow: hidden;
    }
    .compte-header-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .compte-header-info { flex: 1; }
    .compte-header-name {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .compte-header-email {
      font-size: 13px;
      color: var(--text-3);
      margin-top: 4px;
    }
    .compte-header-stats {
      display: flex;
      gap: 24px;
      margin-top: 16px;
    }
    .compte-header-stat {
      font-size: 12px;
      color: var(--text-2);
    }
    .compte-header-stat strong {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      display: block;
    }

    /* === Sections === */
    .compte-card {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px;
      margin-bottom: 24px;
    }
    .compte-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .compte-card h3 {
      font-family: var(--font-display);
      font-size: 18px;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .compte-card .section-desc {
      font-size: 13px;
      color: var(--text-3);
      margin-bottom: 20px;
    }

    /* === Form réglages === */
    .settings-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field label {
      font-family: var(--font-display);
      font-size: 11px;
      color: var(--text-3);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .form-field input {
      background: var(--bg);
      border: 1px solid var(--line-2);
      color: var(--text);
      padding: 10px 14px;
      font-size: 14px;
      border-radius: 4px;
      outline: none;
    }
    .form-field input:focus {
      border-color: var(--sun);
      box-shadow: 0 0 0 2px rgba(255, 200, 87, 0.10);
    }
    .form-row-actions {
      grid-column: 1 / -1;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }
    .btn-save {
      background: var(--gradient-summit);
      color: var(--bg);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 12px 26px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
    }
    .btn-save:hover { transform: translateY(-1px); opacity: 0.95; }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .save-feedback {
      font-size: 12px;
      color: var(--leaf);
      align-self: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .save-feedback.show { opacity: 1; }

    /* === Carte Strava === */
    .strava-card {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .strava-logo {
      width: 56px; height: 56px;
      border-radius: 12px;
      background: rgba(252, 76, 2, 0.12);
      border: 1px solid rgba(252, 76, 2, 0.3);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .strava-logo svg {
      width: 28px; height: 28px;
      fill: none; stroke: #FC4C02; stroke-width: 1.8;
    }
    .strava-info { flex: 1; }
    .strava-info h4 {
      font-family: var(--font-display);
      font-size: 16px;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .strava-info p {
      font-size: 12px;
      color: var(--text-3);
      margin-top: 4px;
    }
    .strava-status-badge {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 4px;
    }
    .strava-status-badge.connected {
      background: rgba(107, 179, 107, 0.15);
      color: var(--leaf);
      border: 1px solid rgba(107, 179, 107, 0.4);
    }
    .strava-status-badge.disconnected {
      background: rgba(110, 106, 94, 0.15);
      color: var(--text-2);
      border: 1px solid var(--line-2);
    }
    .btn-strava-action {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-strava-connect {
      background: #FC4C02;
      color: white;
      border: none;
    }
    .btn-strava-connect:hover { opacity: 0.9; }
    .btn-strava-disconnect {
      background: transparent;
      color: var(--text-2);
      border: 1px solid var(--line-2);
    }
    .btn-strava-disconnect:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* === Simulations épinglées === */
    .sims-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .sim-card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      transition: all 0.2s;
      position: relative;
    }
    .sim-card:hover { border-color: var(--sun); }
    .sim-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .sim-card-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
      padding-right: 30px;
    }
    .sim-card-date {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
    }
    .sim-card-time {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      background: var(--gradient-summit);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 8px 0;
    }
    .sim-card-meta {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: var(--text-2);
      font-family: var(--font-display);
      letter-spacing: 0.04em;
    }
    .sim-card-profile-tag {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 3px;
      border: 1px solid;
      display: inline-block;
      margin-top: 10px;
    }
    .sim-card-profile-tag.trail {
      color: var(--sun);
      border-color: rgba(255, 200, 87, 0.4);
      background: rgba(255, 200, 87, 0.08);
    }
    .sim-card-profile-tag.rando {
      color: var(--sky);
      border-color: rgba(79, 163, 217, 0.4);
      background: rgba(79, 163, 217, 0.08);
    }
    .btn-delete-sim {
      position: absolute;
      top: 14px; right: 14px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text-3);
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-delete-sim:hover { border-color: var(--danger); color: var(--danger); }
    .btn-delete-sim svg { width: 14px; height: 14px; display: block; fill: none; stroke: currentColor; stroke-width: 2; }

    .btn-open-sim {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--gradient-summit);
      color: var(--bg);
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 8px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
      margin-top: 14px;
      width: 100%;
      justify-content: center;
    }
    .btn-open-sim:hover { transform: translateY(-1px); opacity: 0.95; }
    .btn-open-sim svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; }
    .sims-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 32px;
      color: var(--text-3);
      font-size: 13px;
    }

    /* === Zone danger === */
    .danger-zone {
      border-color: rgba(229, 91, 91, 0.3) !important;
    }
    .danger-zone h3 { color: var(--danger); }
    .btn-logout {
      background: transparent;
      color: var(--text-2);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 12px 24px;
      border: 1px solid var(--line-2);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* === Login required === */
    .login-required {
      text-align: center;
      padding: 100px 40px;
    }
    .login-required h2 {
      font-family: var(--font-display);
      font-size: 36px;
      color: var(--text);
      margin-bottom: 12px;
    }
    .login-required p {
      color: var(--text-2);
      margin-bottom: 32px;
    }

    @media (max-width: 768px) {
      .compte-section { padding: 30px 24px; }
      .compte-header { flex-direction: column; text-align: center; }
      .settings-form { grid-template-columns: 1fr; }
      .strava-card { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- ══ Nav ══ -->
  <nav class="nav">
    <a href="/" class="nav-logo">
      <div class="nav-logo-icon">S</div>
      <div class="nav-logo-text">
        <div class="nav-logo-name">SUM<span>'IT</span></div>
        <div class="nav-logo-sub">Plan your peaks</div>
      </div>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link">Accueil</a>
      <a href="profil.html" class="nav-link">Mon profil</a>
      <a href="simulateur.html" class="nav-link">Simulateur</a>
      <a href="avenir.html" class="nav-link">À venir</a>
      <a href="compte.html" class="nav-link active">Mon compte</a>
    </div>
  </nav>

  <!-- ══ Hero ══ -->
  <section class="page-hero">
    <div class="page-hero-content">
      <div class="section-tag">Mon espace</div>
      <h1>Mon <em>compte</em></h1>
      <p>Réglages, connexions et historique de tes simulations.</p>
    </div>
  </section>

  <!-- ══ Contenu ══ -->
  <section class="compte-section" id="compteSection">
    <!-- Rempli dynamiquement -->
  </section>

  <!-- ══ Footer ══ -->
  <footer class="footer">
    <div>
      <div class="footer-logo">SUM<span>'IT</span></div>
      <div class="footer-sub">PLAN YOUR PEAKS</div>
    </div>
    <div class="footer-copy">© 2025 SUM'IT — Beta</div>
  </footer>

  <script src="../js/api-client.js"></script>
  <script src="../js/nav-user.js"></script>
  <script src="../js/onboarding.js"></script>
  <script>

    let currentUser = null;
    let currentSimulations = [];

    // ── Init ────────────────────────────────────────────────────
    (async function init() {
      const section = document.getElementById('compteSection');

      if (!isLoggedIn()) {
        section.innerHTML = `
          <div class="login-required">
            <h2>Connecte-toi pour accéder à ton compte</h2>
            <p>Réglages, Strava, et tes simulations épinglées.</p>
            <button class="btn-primary" onclick="loginGoogle()" style="font-size:14px;">
              Se connecter avec Google
            </button>
          </div>
        `;
        return;
      }

      // Vérifier les retours OAuth Strava
      const params = new URLSearchParams(window.location.search);
      if (params.get('strava_connected') === '1') {
        setTimeout(() => alert('✅ Compte Strava connecté avec succès !'), 200);
        cleanURL(['strava_connected']);
      }
      const stravaError = params.get('strava_error');
      if (stravaError) {
        setTimeout(() => alert(`❌ Erreur Strava : ${stravaError}`), 200);
        cleanURL(['strava_error']);
      }

      try {
        currentUser = await fetchMe();
        await refreshSimulations();
        renderUI();
      } catch (e) {
        section.innerHTML = `<p style="text-align:center;color:var(--danger)">Erreur : ${e.message}</p>`;
      }
    })();

    function cleanURL(paramsToRemove) {
      const url = new URL(window.location);
      paramsToRemove.forEach(p => url.searchParams.delete(p));
      window.history.replaceState({}, '', url.toString());
    }

    // ── Render UI ──────────────────────────────────────────────
    function renderUI() {
      const section = document.getElementById('compteSection');
      const prenom = currentUser.prenom || currentUser.name?.split(' ')[0] || 'Coureur';
      const initiale = prenom[0]?.toUpperCase() || 'C';

      const profilTrail = currentUser.profiles.find(p => p.type === 'trail');
      const profilRando = currentUser.profiles.find(p => p.type === 'rando');
      const nbActivitesTrail = profilTrail?.nb_traces || 0;
      const nbActivitesRando = profilRando?.nb_traces || 0;
      const totalActivites = nbActivitesTrail + nbActivitesRando;

      section.innerHTML = `
        <!-- HEADER UTILISATEUR -->
        <div class="compte-header">
          <div class="compte-header-avatar">
            ${currentUser.picture ? `<img src="${currentUser.picture}">` : initiale}
          </div>
          <div class="compte-header-info">
            <div class="compte-header-name">${escapeHTML(prenom)}</div>
            <div class="compte-header-email">${escapeHTML(currentUser.email)}</div>
            <div class="compte-header-stats">
              <div class="compte-header-stat">
                <strong>${totalActivites}</strong>
                Activités importées
              </div>
              <div class="compte-header-stat">
                <strong>${currentUser.profiles.length}</strong>
                Profil${currentUser.profiles.length>1?'s':''} actif${currentUser.profiles.length>1?'s':''}
              </div>
              <div class="compte-header-stat">
                <strong>${currentSimulations.length}</strong>
                Simulation${currentSimulations.length>1?'s':''} épinglée${currentSimulations.length>1?'s':''}
              </div>
            </div>
          </div>
        </div>

        <!-- RÉGLAGES -->
        <div class="compte-card">
          <h3>⚙️ Réglages du compte</h3>
          <p class="section-desc">Personnalise ton profil et tes paramètres physiologiques.</p>
          <form class="settings-form" onsubmit="event.preventDefault(); sauvegarderReglages();">
            <div class="form-field">
              <label for="setPrenom">Prénom (utilisé dans les PDFs)</label>
              <input type="text" id="setPrenom" value="${escapeHTML(currentUser.prenom || '')}" maxlength="50">
            </div>
            <div class="form-field">
              <label for="setFcmax">FC max (battements/min)</label>
              <input type="number" id="setFcmax" value="${currentUser.fcmax}" min="100" max="250">
            </div>
            <div class="form-row-actions">
              <span class="save-feedback" id="saveFeedback">✓ Enregistré</span>
              <button type="submit" class="btn-save" id="btnSave">Enregistrer</button>
            </div>
          </form>
        </div>

        <!-- STRAVA -->
        <div class="compte-card">
          <h3>🔗 Connexions externes</h3>
          <p class="section-desc">Lie tes comptes pour importer tes activités automatiquement.</p>
          <div class="strava-card">
            <div class="strava-logo">
              <svg viewBox="0 0 24 24"><path d="M12 1l9 16-9 6-9-6 9-16z"/></svg>
            </div>
            <div class="strava-info">
              <h4>Strava</h4>
              <p>${currentUser.strava_connected
                ? 'Importe tes activités directement depuis Strava sur la page Profil.'
                : 'Connecte ton compte Strava pour pouvoir importer tes activités.'}</p>
              <div style="margin-top:8px;">
                <span class="strava-status-badge ${currentUser.strava_connected?'connected':'disconnected'}">
                  ${currentUser.strava_connected ? '✓ Connecté' : 'Non lié'}
                </span>
              </div>
            </div>
            <div>
              ${currentUser.strava_connected
                ? `<button class="btn-strava-action btn-strava-disconnect" onclick="deconnecterStravaAction()">Déconnecter</button>`
                : `<button class="btn-strava-action btn-strava-connect" onclick="loginStrava()">Connecter Strava</button>`}
            </div>
          </div>
        </div>

        <!-- SIMULATIONS ÉPINGLÉES -->
        <div class="compte-card">
          <div class="compte-card-header">
            <h3>⭐ Simulations épinglées</h3>
            <span style="color:var(--text-3);font-size:12px;font-family:var(--font-display);">${currentSimulations.length} / 20</span>
          </div>
          <p class="section-desc">Tes simulations sauvegardées pour les retrouver facilement.</p>
          <div id="simsContainer" class="sims-grid">
            ${renderSimulations()}
          </div>
        </div>

        <!-- ZONE DANGER -->
        <div class="compte-card danger-zone">
          <h3>⚠️ Zone sensible</h3>
          <p class="section-desc">Déconnexion ou actions définitives.</p>
          <button class="btn-logout" onclick="logout()">Se déconnecter</button>
        </div>
      `;
    }

    // ── Simulations épinglées ──────────────────────────────────
    async function refreshSimulations() {
      try {
        const res = await listerSimulations();
        currentSimulations = res.simulations || [];
      } catch (e) {
        console.warn('Impossible de charger les simulations:', e);
        currentSimulations = [];
      }
    }

    function renderSimulations() {
      if (currentSimulations.length === 0) {
        return `<div class="sims-empty">
          Aucune simulation épinglée. Va dans le simulateur et clique sur ⭐ pour en sauvegarder une.
        </div>`;
      }

      return currentSimulations.map(s => {
        const date = new Date(s.created_at).toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'2-digit'});
        const h = Math.floor(s.duree_s / 3600);
        const m = Math.floor((s.duree_s % 3600) / 60);
        const dureeFmt = `${h}h${String(m).padStart(2,'0')}`;
        const profilType = s.type_profil || 'trail';
        return `
          <div class="sim-card">
            <button class="btn-delete-sim" onclick="deleteSimulation(${s.id})" title="Supprimer">
              <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
            <div class="sim-card-header">
              <div>
                <div class="sim-card-title">${escapeHTML(s.name)}</div>
                <div class="sim-card-date">${date}</div>
              </div>
            </div>
            <div class="sim-card-time">${dureeFmt}</div>
            <div class="sim-card-meta">
              <span>${s.dist_km.toFixed(1)} km</span>
              <span>·</span>
              <span>${Math.round(s.dplus_m)} m D+</span>
            </div>
            <span class="sim-card-profile-tag ${profilType}">${profilType==='trail'?'🏃 Trail':'🥾 Rando'}</span>
            <button class="btn-open-sim" onclick="ouvrirSimulation(${s.id})">
              <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
              Ouvrir dans le simulateur
            </button>
          </div>
        `;
      }).join('');
    }

    function ouvrirSimulation(id) {
      window.location.href = `simulateur.html?sim_id=${id}`;
    }

    async function deleteSimulation(id) {
      if (!confirm('Supprimer cette simulation épinglée ?')) return;
      try {
        await supprimerSimulation(id);
        await refreshSimulations();
        renderUI();
      } catch (e) {
        alert('Erreur : ' + e.message);
      }
    }

    // ── Réglages ───────────────────────────────────────────────
    async function sauvegarderReglages() {
      const btn = document.getElementById('btnSave');
      const feedback = document.getElementById('saveFeedback');
      const prenom = document.getElementById('setPrenom').value.trim();
      const fcmax  = parseInt(document.getElementById('setFcmax').value);

      if (!prenom) {
        alert('Le prénom ne peut pas être vide');
        return;
      }
      if (!fcmax || fcmax < 100 || fcmax > 250) {
        alert('FC max doit être entre 100 et 250 bpm');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Enregistrement...';

      try {
        await updateSettings({ prenom, fcmax });
        currentUser.prenom = prenom;
        currentUser.fcmax = fcmax;
        setCachedUser(currentUser);

        feedback.classList.add('show');
        setTimeout(() => feedback.classList.remove('show'), 2000);
      } catch (e) {
        alert('Erreur : ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enregistrer';
      }
    }

    // ── Strava déconnexion ────────────────────────────────────
    async function deconnecterStravaAction() {
      if (!confirm('Déconnecter ton compte Strava ? Tes activités déjà importées seront conservées.')) return;
      try {
        await deconnecterStrava();
        currentUser.strava_connected = false;
        renderUI();
        alert('✅ Strava déconnecté');
      } catch (e) {
        alert('Erreur : ' + e.message);
      }
    }

    function escapeHTML(s) {
      return String(s || '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }

  </script>
</body>
